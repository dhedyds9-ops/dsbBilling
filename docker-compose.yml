version: '3.8'

services:
  # ==========================================
  # dsBilling Services (App, Web, DB, Redis)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - isp-network

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - isp-network

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dsbilling}
      MYSQL_USER: ${DB_USERNAME:-dsbilling}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - isp-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - isp-network

  # ==========================================
  # GenieACS Services (TR-069 ACS)
  # ==========================================
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - isp-network

  genieacs-cwmp:
    image: genieacs/genieacs:1.2.13
    command: ["genieacs-cwmp"]
    restart: unless-stopped
    ports:
      - "7547:7547"
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: "mongodb://mongo:27017/genieacs"
    depends_on:
      - mongo
    networks:
      - isp-network

  genieacs-nbi:
    image: genieacs/genieacs:1.2.13
    command: ["genieacs-nbi"]
    restart: unless-stopped
    ports:
      - "7557:7557"
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: "mongodb://mongo:27017/genieacs"
    depends_on:
      - mongo
    networks:
      - isp-network

  genieacs-fs:
    image: genieacs/genieacs:1.2.13
    command: ["genieacs-fs"]
    restart: unless-stopped
    ports:
      - "7567:7567"
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: "mongodb://mongo:27017/genieacs"
    depends_on:
      - mongo
    networks:
      - isp-network

  genieacs-ui:
    image: genieacs/genieacs:1.2.13
    command: ["genieacs-ui"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: "mongodb://mongo:27017/genieacs"
    depends_on:
      - mongo
    networks:
      - isp-network

networks:
  isp-network:
    driver: bridge

volumes:
  db-data:
  mongo-data: