<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
    <defs>
        <linearGradient id="fiberGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
    </defs>

    <!-- Dark Mode Logo Lockup -->
    <g transform="translate(15, 15)">
        <!-- Left 'd' Network Beam -->
        <rect x="12" y="25" width="14" height="14" rx="3" fill="url(#fiberGradDark)" />
        <rect x="30" y="10" width="14" height="14" rx="3" fill="url(#fiberGradDark)" />
        <rect x="30" y="28" width="14" height="14" rx="3" fill="url(#fiberGradDark)" />
        <rect x="52" y="10" width="14" height="90" rx="4" fill="url(#fiberGradDark)" />
        <path d="M30,46 L52,46 L52,58 L42,58 L42,80 L52,80 L52,94 L30,94 C22,94 22,88 22,82 L22,58 C22,50 24,46 30,46 Z" fill="url(#fiberGradDark)" />
        <path d="M22,102 L66,102 L66,122 L22,110 Z" fill="url(#fiberGradDark)" />

        <!-- Right 's' & Fiber Nodes -->
        <path d="M72,18 L114,30 L114,44 L72,30 Z" fill="#94a3b8" />
        <path d="M72,48 L110,48 L110,62 L84,62 L84,74 L110,74 L110,102 L72,102 L72,88 L98,88 L98,76 L72,76 Z" rx="2" fill="#94a3b8" />
        <path d="M72,106 L110,106 L110,113 L72,126 Z" fill="#94a3b8" />

        <!-- Emerald Status LED -->
        <circle cx="114" cy="20" r="6" fill="#34d399" />
        
        <!-- Signal / Network Grid Dots -->
        <circle cx="42" cy="116" r="3.5" fill="#38bdf8" />
        <circle cx="54" cy="118" r="3.5" fill="#38bdf8" />
        <circle cx="78" cy="118" r="3.5" fill="#94a3b8" />
        <circle cx="90" cy="116" r="3.5" fill="#94a3b8" />
    </g>

    <!-- Typography Group (Dark Mode High Contrast) -->
    <g transform="translate(165, 80)">
        <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="64px" letter-spacing="-1.2px">ds<tspan fill="#38bdf8" font-weight="700">Billing</tspan></text>
        <text x="4" y="30" fill="#38bdf8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="15px" letter-spacing="4px" font-weight="700">TECHNICIAN &amp; MONITORING</text>
        <text x="4" y="48" fill="#94a3b8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11px" letter-spacing="1.5px" font-weight="500">ISP OPERATIONS &amp; NETWORK DIAGNOSTICS</text>
    </g>
</svg>
